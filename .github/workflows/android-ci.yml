name: Android CI

on:
  push:
    branches:
      - main
      - master
      - "arena/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a gradle-ci.log

      - name: Assemble Debug & Release APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee -a gradle-ci.log

      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee -a gradle-ci.log

      - name: Surface failure diagnostics as annotations
        if: failure()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            grep -E "Error:" app/build/reports/lint-results-debug.txt | head -n 15 | while IFS= read -r line; do
              echo "::error title=Lint::$line"
            done
          fi
          if [ -f gradle-ci.log ]; then
            grep -E "(^e: |FAILURE:|What went wrong:|^\* |Exception|Error:)" gradle-ci.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FT-Cloud-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FT-Cloud-Release-APK
          path: app/build/outputs/apk/release/*.apk
