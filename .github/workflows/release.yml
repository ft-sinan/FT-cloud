name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed FT Cloud APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      FTCLOUD_RELEASE_STORE_PASSWORD: ${{ secrets.FTCLOUD_RELEASE_STORE_PASSWORD }}
      FTCLOUD_RELEASE_KEY_ALIAS: ${{ secrets.FTCLOUD_RELEASE_KEY_ALIAS }}
      FTCLOUD_RELEASE_KEY_PASSWORD: ${{ secrets.FTCLOUD_RELEASE_KEY_PASSWORD }}
      MYVAULT_RELEASE_STORE_PASSWORD: ${{ secrets.MYVAULT_RELEASE_STORE_PASSWORD }}
      MYVAULT_RELEASE_KEY_ALIAS: ${{ secrets.MYVAULT_RELEASE_KEY_ALIAS }}
      MYVAULT_RELEASE_KEY_PASSWORD: ${{ secrets.MYVAULT_RELEASE_KEY_PASSWORD }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore persistent fallback signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ftcloud-signing-keystore-v1
          restore-keys: |
            ftcloud-signing-keystore-

      - name: Validate release tag & configure signing keystore
        shell: bash
        env:
          FTCLOUD_RELEASE_KEYSTORE_BASE64: ${{ secrets.FTCLOUD_RELEASE_KEYSTORE_BASE64 }}
          MYVAULT_RELEASE_KEYSTORE_BASE64: ${{ secrets.MYVAULT_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.1.0 (got: $RELEASE_TAG)"
            exit 1
          fi

          app_version="$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app versionName $app_version"
            exit 1
          fi

          keystore_b64="${FTCLOUD_RELEASE_KEYSTORE_BASE64:-${MYVAULT_RELEASE_KEYSTORE_BASE64:-${SIGNING_KEY:-}}}"
          if [[ -n "$keystore_b64" ]]; then
            keystore_path="$RUNNER_TEMP/ftcloud-release.jks"
            printf '%s' "$keystore_b64" | base64 --decode > "$keystore_path"
            test -s "$keystore_path"
            echo "FTCLOUD_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.android
            if [[ ! -s ~/.android/debug.keystore ]]; then
              keytool -genkeypair -v \
                -keystore ~/.android/debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=FT Cloud,OU=Mobile,O=FT,C=IN"
            fi
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests & build signed release APK
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee /tmp/release-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |error: |FAILED|FAILURE:' /tmp/release-build.log | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Prepare release assets, verify signature & extract changelog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="FTCloud-${RELEASE_TAG}.apk"
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          test -n "$release_apk" && test -s "$release_apk"
          cp "$release_apk" "release-assets/$apk_name"
          (
            cd release-assets
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [[ -n "$apksigner_bin" ]]; then
            "$apksigner_bin" verify --print-certs "release-assets/$apk_name"
          fi

          awk -v version="$APP_VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            printf 'FT Cloud %s\n' "$RELEASE_TAG" > /tmp/release-notes.md
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_name="FTCloud-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release-assets/$apk_name" \
              "release-assets/$apk_name.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "FT Cloud $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "release-assets/$apk_name" \
              "release-assets/$apk_name.sha256" \
              --target "${{ github.sha }}" \
              --title "FT Cloud $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
